# Scheduled/manual, non-gating Native AOT measurements; never compare runner labels as identical hardware.
name: Benchmarks

permissions:
  contents: read

on:
  # A changed benchmark contract can validate itself on a feature branch; manual
  # dispatch and schedules require this workflow to exist on the default branch.
  push:
    paths:
      - '.github/workflows/benchmarks.yml'
      - 'tests/Mote.Benchmarks/**'
      - 'tests/Measure-NativeStartup.ps1'
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1'

jobs:
  engine:
    name: Native AOT engine open/edit / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: macos-26
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish process-isolated engine benchmark as Native AOT
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          dotnet publish tests/Mote.Benchmarks/Mote.Benchmarks.csproj `
            --configuration Release --runtime $rid --self-contained true `
            -p:PublishAot=true -p:ContinuousIntegrationBuild=true `
            -p:DebugType=none -p:StripSymbols=false `
            -o ".temp/benchmarks/engine-$rid"
          if ($LASTEXITCODE -ne 0) { throw "Native AOT benchmark publish failed ($LASTEXITCODE)." }
      - name: Measure 1/10/100 MiB line-oriented and long-line open/edit
        shell: pwsh
        timeout-minutes: 15
        run: |
          $rid = '${{ matrix.rid }}'
          $name = if ($IsWindows) { 'Mote.Benchmarks.exe' } else { 'Mote.Benchmarks' }
          $exe = (Resolve-Path ".temp/benchmarks/engine-$rid/$name").Path
          foreach ($size in 1, 10, 100) {
            foreach ($mode in '--open-edit', '--long-line') {
              for ($rep = 1; $rep -le 3; $rep++) {
                & $exe $size $mode
                if ($LASTEXITCODE -ne 0) { throw "Benchmark failed: $size MiB $mode repetition $rep" }
              }
            }
          }
          for ($rep = 1; $rep -le 3; $rep++) {
            & $exe 1
            if ($LASTEXITCODE -ne 0) { throw "Markdown analysis benchmark failed: repetition $rep" }
          }
          $rows = @(Get-Content '.cache/benchmarks/results.jsonl')
          if ($rows.Count -ne 21) { throw "Expected 21 isolated benchmark rows, got $($rows.Count)." }
      - name: Upload raw engine timing and peak-working-set samples
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-engine-${{ matrix.rid }}
          path: .cache/benchmarks/results.jsonl
          if-no-files-found: error
          retention-days: 30

  native-startup:
    name: Native AOT GUI smoke process / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: macos-26
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish single native editor executable
        shell: pwsh
        run: |
          dotnet publish src/Mote.Native/Mote.Native.csproj `
            --configuration Release --runtime '${{ matrix.rid }}' --self-contained true `
            -p:PublishAot=true -p:ContinuousIntegrationBuild=true `
            -p:DebugType=none -p:GenerateDocumentationFile=false -p:StripSymbols=false
          if ($LASTEXITCODE -ne 0) { throw "Native editor AOT publish failed ($LASTEXITCODE)." }
      - name: Measure first run and paired telemetry-off/on warm GUI smoke
        shell: pwsh
        timeout-minutes: 5
        run: |
          $rid = '${{ matrix.rid }}'
          $name = if ($IsWindows) { 'mote.exe' } else { 'mote' }
          $exe = "src/Mote.Native/bin/Release/net10.0/$rid/publish/$name"
          & ./tests/Measure-NativeStartup.ps1 `
            -ExecutablePath $exe -RuntimeIdentifier $rid -WarmRuns 10 -CompareTelemetry
          if ($LASTEXITCODE -ne 0) { throw "Native startup measurement failed ($LASTEXITCODE)." }
      - name: Upload process-level timing and sampled RSS
        uses: actions/upload-artifact@v4
        with:
          name: native-startup-${{ matrix.rid }}
          path: |
            .cache/benchmarks/native-startup.jsonl
            .cache/benchmarks/native-startup-samples.jsonl
          if-no-files-found: error
          retention-days: 30

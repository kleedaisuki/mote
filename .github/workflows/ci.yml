        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-real-ime-activation-syntax-${{ matrix.rid }}
          path: .cache/ci-inventory/${{ matrix.rid }}/mac-real-ime-activation-syntax.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # Synthetic NSTextView marked text is committed and then cancelled under
      # window-local appearance switches; neither path is a real CJK IME test.
      - name: Diagnose macOS marked-text theme transition (non-gating)
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeCompositionThemeWorkflow-Mac.ps1 `

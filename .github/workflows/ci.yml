            -ReportPath ".cache/ci-inventory/$rid/mac-external-workflow.json"
      # The ordinary product is now Canvas; legacy-page keeps its strict oracle.
      # This new external source-AX + keyboard/disk check remains diagnostic.
      - name: Diagnose ordinary macOS Continuous keyboard workflow (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 6
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeMacContinuousWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote" `
            -ReportPath ".cache/ci-inventory/$rid/native-continuous-mac.json"
      - name: Upload ordinary macOS Continuous diagnostic
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: native-continuous-mac-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/native-continuous-mac.json
            .temp/mac-continuous-workflow/**/*.stdout.txt
            .temp/mac-continuous-workflow/**/*.stderr.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # Target-host preview gestures are diagnostic until AX/Quartz behavior is
      # independently observed on both Mach-O architectures. Four cases cover
      # both editor profiles, pointer activation, Return, and Space.
      - name: Diagnose macOS preview-to-source navigation (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 12
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          $exe = "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote"
          $cases = @(
            @{ name = 'continuous-pointer'; legacy = $false; pointer = $true; space = $false },
            @{ name = 'continuous-enter'; legacy = $false; pointer = $false; space = $false },
            @{ name = 'legacy-pointer'; legacy = $true; pointer = $true; space = $false },
            @{ name = 'legacy-space'; legacy = $true; pointer = $false; space = $true }
          )
          $failed = @()
          foreach ($case in $cases) {
            try {
              & ./tests/NativeMacPreviewNavigation.ps1 `
                -ExecutablePath $exe `
                -ReportPath ".cache/ci-inventory/$rid/mac-preview-navigation-$($case.name).json" `
                -LegacyPage:$($case.legacy) -Pointer:$($case.pointer) -Space:$($case.space)
            } catch {
              $failed += $case.name
              Write-Warning "Preview navigation $($case.name) failed: $_"
            }
          }
          if ($failed.Count) { throw "Mac preview navigation cases failed: $($failed -join ', ')" }
      - name: Upload macOS preview navigation diagnostics
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-preview-navigation-${{ matrix.rid }}
          path: .cache/ci-inventory/${{ matrix.rid }}/mac-preview-navigation-*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # This isolated AppKit probe installs a real attributed Flow view without
      # changing input sources, user files, configuration, clipboard, or TCC.
      # Keep it diagnostic until both published Mach-O architectures are observed.
      - name: Diagnose native macOS Flow rendering (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeMacFlowRendering.ps1 `
            -Executable "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote"
      # In-memory settings only: the probe owns its AppKit window and document.
      # It does not load user configuration or write files, clipboard, or TCC.
      - name: Diagnose native macOS theme override reload (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          $exe = "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote"
          $output = & $exe --check-native-mac-theme-overrides 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0 -or -not ($output -contains 'mote-native-mac-theme-overrides-ready')) {
            throw "AppKit theme override diagnostic failed (exit $code)."
          }
      # In-memory owner-only AppKit table; no file, clipboard, input-source,
      # TCC, network, or external event mutation. The window affects only the
      # disposable hosted runner's foreground state.
      - name: Diagnose native macOS CSV Grid (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          $exe = "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote"
          $output = & $exe --check-native-mac-csv-grid 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0 -or -not ($output -contains 'mote-native-mac-csv-grid-ready')) {
            throw "AppKit CSV Grid diagnostic failed (exit $code)."
          }
      # Opt-in selector/NSRange/retirement checks in an owned in-memory AppKit
      # table. This is not external AX or VoiceOver acceptance, and it touches
      # no user file, input source, pasteboard, TCC permission, or configuration.
      - name: Diagnose native macOS CSV Grid AX selectors (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          $source = 'src/Mote.Native/Mac/MacCsvGridAccessibilityProbe.cs'
          $reviewed = '7F51D0A494BCC96E1831D866D55C8848D16372EAE2AD5B811743A6BCC1345D14'
          if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -cne $reviewed) {
            throw 'Mac Grid AX selector probe differs from reviewed bytes.'
          }
          $exe = "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote"
          $env:MOTE_NATIVE_GRID_ACCESSIBILITY = '1'
          try {
            $output = & $exe --check-native-mac-csv-grid 2>&1
            $code = $LASTEXITCODE
          } finally {
            Remove-Item Env:MOTE_NATIVE_GRID_ACCESSIBILITY -ErrorAction SilentlyContinue
          }
          $output | ForEach-Object { Write-Output $_ }
          $markers = @('mote-native-mac-csv-grid-ready',
            'Mac CSV Grid AX selector probe passed; external AX/VoiceOver/geometry gates remain untested.')
          foreach ($marker in $markers) {
            $count = @($output | Where-Object { [string]::Equals([string]$_, $marker, [StringComparison]::Ordinal) }).Count
            if ($count -ne 1) { throw "AppKit Grid AX selector marker missing or duplicated (exit $code)." }
          }
          if ($code -ne 0) { throw "AppKit Grid AX selector diagnostic failed (exit $code)." }
      # Exact-PID separate Swift AX client, not an in-process selector or a
      # VoiceOver/IME acceptance. It owns only a synthetic file and process;
      # absent AX trust or inaccessible context-menu navigation is not a pass.
      - name: Diagnose external macOS CSV Grid AX (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 6
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $rid = '${{ matrix.rid }}'
          $pins = @(
            @{ path = 'tests/MacGridAxExternalProbe/Probe.swift'; hash = '5E6B498ACE4C44783E5E3D90CA67FE45DEAEE7290D7F43799FCBCF4E0E9086CA' },
            @{ path = 'tests/MacGridAxExternalProbe/Run.ps1'; hash = 'A8CE1FD27A4E33745EC526A739D609260E51893B41A5E1BD5B305C6A48CDC505' },
            @{ path = 'tests/MacGridAxExternalProbe/MenuTraceCapture.cs'; hash = '9715CDA6210599BAE94AB3C283A6A514715374758441AE265F44D5F3E6495265' }
          )
          foreach ($pin in $pins) {
            $actual = (Get-FileHash -LiteralPath $pin.path -Algorithm SHA256).Hash
            if (-not [StringComparer]::Ordinal.Equals($actual, $pin.hash)) {
              throw 'External Mac Grid AX probe differs from reviewed bytes.'
            }
          }
          $exe = "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote"
          $report = ".cache/ci-inventory/$rid/mac-grid-ax-external.json"
          & ./tests/MacGridAxExternalProbe/Run.ps1 `
            -ExecutablePath $exe -RuntimeIdentifier $rid -ReportPath $report
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          $binary = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          if (-not [StringComparer]::Ordinal.Equals($result.status, 'passed') -or
              -not [StringComparer]::Ordinal.Equals($result.binary_sha256, $binary) -or
              -not $result.editor_normal_exit -or -not $result.input_sha256_unchanged) {
            throw 'External Mac Grid AX diagnostic did not pass; inspect the retained report.'
          }
          Write-Host 'External Mac CSV Grid AX subset passed; VoiceOver/IME/geometry/release gates remain untested.'
      - name: Upload external macOS CSV Grid AX diagnostic
        if: always() && startsWith(matrix.rid, 'osx-')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mac-grid-ax-external-${{ matrix.rid }}
          path: .cache/ci-inventory/${{ matrix.rid }}/mac-grid-ax-external.json
          if-no-files-found: warn
          retention-days: 14
      # Two process-owned hidden NSScroller instances only; probe source bytes
      # are independently reviewed and no clipboard or desktop input is used.
      - name: Diagnose native macOS logical Grid scrollers (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          $hash = (Get-FileHash src/Mote.Native/Mac/MacGridScrollerProbe.cs -Algorithm SHA256).Hash
          $reviewed = @('E0E0CCDA60C1AC2DC144CE01CE65B420457F1B9BDDB85899225762AB9F5B2938', '63A3CFF32138CBA344D8A8CA91347B666AF37DB9FC9825ACB3527400EDCF97C5')
          if ($hash -cnotin $reviewed) { throw 'Mac Grid scroller probe differs from reviewed bytes.' }
          $exe = "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote"
          $output = & $exe --check-native-mac-grid-scroller 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $marker = 'mote-native-mac-grid-scroller-ready; native-action=synthetic; physical-input=not-tested; controller-stale-token=not-tested'
          if ($code -ne 0 -or @($output | Where-Object { $_ -ceq $marker }).Count -ne 1) {
            throw "AppKit logical Grid scroller diagnostic failed (exit $code)."
          }
      # Owned AppKit source probe for embedded NUL/literal-marker preservation.
      # It edits only an unsaved in-memory document and touches no user state.
      - name: Diagnose native macOS source NUL preservation (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          $exe = "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote"
          $output = & $exe --check-native-mac-source-nul 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0 -or -not ($output -contains 'mote-native-mac-source-nul-ready')) {
            throw "AppKit source NUL diagnostic failed (exit $code)."
          }
      # Each mode uses its own disposable AppKit process and repo-local,
      # content-free JSONL. A draw callback is not physical presentation.
      - name: Diagnose native macOS legacy draw tracing (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          $exe = "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote"
          $output = & $exe --check-native-mac-draw-trace legacy 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0 -or -not ($output -contains 'mote-native-mac-draw-trace-ready mode=legacy; endpoint=source-draw-return; physical-presentation=not-tested')) {
            throw "AppKit legacy draw trace diagnostic failed (exit $code)."
          }
      - name: Diagnose native macOS continuous draw tracing (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          $exe = "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote"
          $output = & $exe --check-native-mac-draw-trace continuous 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0 -or -not ($output -contains 'mote-native-mac-draw-trace-ready mode=continuous; endpoint=source-draw-return; physical-presentation=not-tested')) {
            throw "AppKit continuous draw trace diagnostic failed (exit $code)."
          }
      - name: Upload native macOS draw trace diagnostics
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: native-mac-draw-trace-${{ matrix.rid }}
          path: .temp/mac-draw-trace/**/*.jsonl
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Upload external macOS workflow report
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-external-workflow-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/mac-external-workflow.json
            .temp/mac-external-workflow/**
          if-no-files-found: warn
      - name: Upload failed GUI workflow fixtures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-gui-workflow-${{ matrix.rid }}
          path: |
            .temp/mac-native-*.txt
            .temp/ci-smoke/canvas-*.txt
            .temp/gui-workflow/**
          if-no-files-found: ignore

      # Fresh ordinary JSON source-backed processes on every native RID. This
      # capability/phase pilot is not a tail SLA or compositor-paint observation.
      # All edits are exact-PID HWND/Quartz transactions; no global input or TCC.
      - name: Set up native-architecture Python for JSON acceptance pilot
        id: json_acceptance_python
        if: always()
        uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: '3.14'
          architecture: ${{ contains(matrix.rid, 'arm64') && 'arm64' || 'x64' }}
      - name: Diagnose ordinary Native AOT JSON 1 and 100 MiB source (non-gating)
        if: always() && steps.json_acceptance_python.outcome == 'success'
        shell: pwsh
        timeout-minutes: 20
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $rid = '${{ matrix.rid }}'
          $name = if ($IsWindows) { 'mote.exe' } else { 'mote' }
          & python -m unittest discover -s benchmarks/NativeJsonLargeAcceptance -p test_probe.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native JSON acceptance artifact/protocol tests failed.' }
          & python benchmarks/NativeJsonLargeAcceptance/probe.py `
            --executable "src/Mote.Native/bin/Release/net10.0/$rid/publish/$name" `
            --rid $rid --output ".cache/ci-inventory/$rid/native-json-large.json"
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Native JSON source pilot incomplete (exit $code); inspect fixed report classifications." }
          $report = Get-Content ".cache/ci-inventory/$rid/native-json-large.json" -Raw | ConvertFrom-Json
          if ($report.status -cne 'pass' -or $report.samples.Count -ne 2 -or
              @($report.samples | Where-Object status -CNE 'pass').Count -ne 0) {
            throw 'Native JSON source pilot did not pass its exact two-case coverage contract.'
          }
          Write-Host 'Ordinary Native AOT JSON source pilot passed; physical paint, real IME and tail latency remain untested.'
      - name: Upload ordinary Native AOT JSON pilot report and local traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-json-large-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/native-json-large.json
            .temp/native-json-large/**/traces/*.jsonl
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  # Capture replacement-phase evidence on a disposable runner. Its positive
  # held-share control and ordinary samples touch synthetic files only; a
  # failure is diagnostic, not permission to weaken the strict release gates.
  windows-save-diagnostic:
    name: Windows Save replacement diagnostic / disposable x64
    if: github.event_name == 'push'
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate synthetic Save diagnostic contracts
        shell: pwsh
        timeout-minutes: 2
        run: '& ./tests/Invoke-WindowsSaveDiagnostic.ps1 -SelfTest'
      - name: Publish exact-source AOT and diagnose ordinary Save
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = (& ./tests/New-WindowsSaveDiagnosticPublish.ps1 | Select-Object -Last 1)
          if ([string]::IsNullOrWhiteSpace($manifestPath)) {
            throw 'Exact-source Save diagnostic publish produced no manifest.'
          }
          & ./tests/Invoke-WindowsSaveDiagnostic.ps1 `
            -PublishManifest $manifestPath.Trim() -OrdinaryRuns 4
      - name: Upload synthetic Save diagnostic evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-save-diagnostic-x64
          path: |
            .cache/windows-save-diagnostic/**
            .cache/windows-save-diagnostic-publish/*/publish-manifest.json
            .cache/windows-save-diagnostic-publish/*/publish.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  # The Windows Grid clipboard check is isolated from the ordinary suite and
  # runs on a fresh disposable GitHub-hosted runner with its own approval gate.
  native-grid-clipboard:
    name: Native CSV Grid clipboard / disposable Windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify actual native CSV Grid clipboard roundtrip
        shell: pwsh
        run: '& ./tests/Invoke-NativeCsvGridClipboardWorkflow.ps1'
      - name: Upload native clipboard acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-grid-clipboard-windows
          path: |
            .cache/native-grid-clipboard/report.json
            .cache/native-grid-clipboard/clipboard.trx
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  # Each Mac Grid clipboard probe owns a fresh disposable runner. Mutation
  # permission exists only in the reviewed native subprocess, never the job env.
  native-mac-grid-clipboard:
    name: Native CSV Grid clipboard / disposable ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify actual native Mac CSV Grid clipboard roundtrip
        shell: pwsh
        run: "& ./tests/Invoke-NativeMacCsvGridClipboardWorkflow.ps1 -RuntimeIdentifier '${{ matrix.rid }}'"
      - name: Upload native Mac clipboard acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mac-grid-clipboard-${{ matrix.rid }}
          path: |
            .cache/native-mac-grid-clipboard/report.json
            .cache/native-mac-grid-clipboard/stdout.txt
            .cache/native-mac-grid-clipboard/stderr.txt
            .cache/native-mac-grid-clipboard/exit-code.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

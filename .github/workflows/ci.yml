# Build and test the complete single-file editor on both supported desktop platforms.
name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore mote.sln
      - name: Build complete solution, including desktop executable
        run: dotnet build mote.sln --configuration Release --no-restore
      - name: Test complete solution
        # The runner log already captures failures; avoid creating unuploaded
        # project-local TestResults outside the repository .cache/.temp roots.
        run: dotnet test mote.sln --configuration Release --no-build
      - name: Build non-gating benchmark harness
        run: dotnet build tests/Mote.Benchmarks/Mote.Benchmarks.csproj --configuration Release

  native-aot:
    name: Single-binary Native AOT / ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Native AOT requires a native linker/toolchain, hence the native-architecture matrix.
      - name: Publish native OS-shell executable
        run: dotnet publish src/Mote.Native/Mote.Native.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:ContinuousIntegrationBuild=true -p:DebugType=none -p:GenerateDocumentationFile=false -p:StripSymbols=false
      - name: Inventory Native AOT publish payload
        id: inventory
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $publish = "src/Mote.Native/bin/Release/net10.0/$rid/publish"
          $executableName = if ($IsWindows) { 'mote.exe' } else { 'mote' }
          $files = @(Get-ChildItem -LiteralPath $publish -File -Recurse | ForEach-Object {
            [pscustomobject]@{
              path = [IO.Path]::GetRelativePath((Resolve-Path $publish).Path, $_.FullName)
              bytes = $_.Length
            }
          })
          $other = @($files | Where-Object { $_.path -ne $executableName })
          $nativeLibraries = @($other | Where-Object { $_.path -match '\.(dll|dylib|so)$' })
          $inventory = [pscustomobject]@{
            rid = $rid
            executable = $executableName
            payload_files = $files
            non_executable_payload_count = $other.Count
            bundled_native_library_count = $nativeLibraries.Count
          }
          $directory = ".cache/ci-inventory/$rid"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $path = Join-Path $directory 'publish-inventory.json'
          $inventory | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $path -Encoding utf8
          Get-Content -LiteralPath $path
      - name: Verify macOS imports use system libraries
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        run: |
          $publish = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish"
          $imports = & otool -L (Join-Path $publish 'mote')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect native executable dependencies.' }
          $imports | ForEach-Object { Write-Host $_ }
          foreach ($line in $imports | Select-Object -Skip 1) {
            $dependency = ($line.Trim() -split '\s+')[0]
            if ($dependency -notmatch '^(/usr/lib/|/System/Library/)') {
              throw "Non-system Mach-O import violates the one-binary contract: $dependency"
            }
          }
      - name: Verify Windows imports use reviewed system DLLs
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          & .github/scripts/check-windows-imports.ps1 `
            -Executable "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote.exe" `
            -Report ".cache/ci-inventory/$rid/imports.json"
      - name: Upload native dependency inventory
        if: always() && steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-inventory-${{ matrix.rid }}
          path: .cache/ci-inventory/${{ matrix.rid }}/
          if-no-files-found: error
      - name: Assert strict single-binary delivery contract
        if: always() && steps.inventory.outcome == 'success'
        shell: pwsh
        run: |
          $inventory = Get-Content ".cache/ci-inventory/${{ matrix.rid }}/publish-inventory.json" -Raw | ConvertFrom-Json
          if ($inventory.non_executable_payload_count -ne 0) {
            throw "Native AOT publish is not one executable: $($inventory.non_executable_payload_count) additional payload files, including $($inventory.bundled_native_library_count) bundled native libraries. See uploaded inventory."
          }
      # This one-case capability probe is deliberately non-gating: the external
      # source/selection observer is not an input-to-paint latency acceptance.
      - name: Set up Python for Windows structured-text readiness pilot
        if: matrix.rid == 'win-x64'
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose fresh Windows AOT JSON source readiness (non-gating)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $manifestPath = (python benchmarks/NativeAcceptance/acceptance.py prepare `
            --sizes 1 --formats json --shapes long).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Readiness corpus preparation failed.' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.cases.Count -ne 1 -or $manifest.cases[0].case -cne 'json-long-1') {
            throw 'Unexpected readiness corpus.'
          }
          $case = $manifest.cases[0]
          $pinnedSha = 'bae792983708d005e143e90cfcb3a2110554dd590dd299059fb0d842dc20b5dd'
          if ($case.sha256 -cne $pinnedSha) { throw 'Readiness corpus SHA differs from independent pin.' }
          $exe = 'src/Mote.Native/bin/Release/net10.0/win-x64/publish/mote.exe'
          & ./benchmarks/NativeStartup/Measure-WindowsOrdinary.ps1 `
            -ExecutablePath $exe -FixturePath (Join-Path (Get-Location) $case.fixture) `
            -FixtureSha256 $pinnedSha -SizeMiB 1 -Runs 1 -ReadinessOnly | Out-Host
          $rows = @(Get-Content -LiteralPath '.cache/native-startup/ordinary-windows.jsonl')
          if ($rows.Count -ne 1) { throw "Expected one fresh readiness row, found $($rows.Count)." }
          $row = $rows[0] | ConvertFrom-Json
          $exeSha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $head = (git rev-parse HEAD).Trim()
          if ($row.status -cne 'passed' -or
              $row.git_head -cne $head -or $row.executable_sha256 -cne $exeSha -or
              $row.fixture_kind -cne 'external-pinned-readiness-only' -or
              $row.fixture_format -cne 'json' -or
              $row.original_fixture_sha256 -cne $pinnedSha -or
              $row.copied_fixture_sha256_after_probe -cne $pinnedSha -or
              $row.input_fixture_sha256_after_probe -cne $pinnedSha -or
              $row.child_process_id -le 0 -or -not $row.canvas_seen -or -not $row.editor_seen -or
              $row.source_prefix -cne 'pinned-20-byte-ASCII-prefix-verified' -or
              $row.selection_ack_ms -eq $null -or $row.diagnostic_trace -or
              $row.edit_dirty_ack_ms -ne $null -or $row.save_exact_ms -ne $null -or
              $row.configuration_ms -ne $null -or $row.child_open_to_editable_ms -ne $null -or
              $row.child_open_to_draw_submission_ms -ne $null) {
            throw 'Readiness row failed its source, provenance, no-mutation, or endpoint contract.'
          }
          Write-Host "Readiness capability passed for fresh $head win-x64 AOT; no latency threshold claimed."
      - name: Upload Windows structured-text readiness diagnostic
        if: always() && matrix.rid == 'win-x64'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-readiness-win-x64
          path: |
            .cache/native-startup/ordinary-windows.jsonl
            .cache/native-acceptance/corpus-*.json
          if-no-files-found: warn
          retention-days: 14
      # Keep parent launch observation and child causal durations separate.
      # Natural draw callback return is not physical or compositor paint.
      - name: Diagnose Windows AOT natural-close open trace (non-gating)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $manifestPath = (python benchmarks/NativeAcceptance/acceptance.py prepare `
            --sizes 1 --formats json --shapes long).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Natural-close corpus preparation failed.' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.cases.Count -ne 1 -or $manifest.cases[0].case -cne 'json-long-1') {
            throw 'Unexpected natural-close corpus.'
          }
          $case = $manifest.cases[0]
          $pinnedSha = 'bae792983708d005e143e90cfcb3a2110554dd590dd299059fb0d842dc20b5dd'
          if ($case.sha256 -cne $pinnedSha) { throw 'Natural-close corpus SHA differs from independent pin.' }
          $exe = 'src/Mote.Native/bin/Release/net10.0/win-x64/publish/mote.exe'
          & ./benchmarks/NativeStartup/Measure-WindowsOrdinary.ps1 `
            -ExecutablePath $exe -FixturePath (Join-Path (Get-Location) $case.fixture) `
            -FixtureSha256 $pinnedSha -SizeMiB 1 -Runs 1 -ReadinessOnly `
            -NaturalCloseTrace -TraceObservationMilliseconds 1000 | Out-Host
          $rows = @(Get-Content -LiteralPath '.cache/native-startup/ordinary-windows.jsonl' |
            ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.natural_close_trace })
          if ($rows.Count -ne 1) { throw "Expected one natural-close row, found $($rows.Count)." }
          $row = $rows[0]
          $exeSha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $head = (git rev-parse HEAD).Trim()
          if ($row.status -cne 'passed' -or $row.git_head -cne $head -or
              $row.executable_sha256 -cne $exeSha -or $row.original_fixture_sha256 -cne $pinnedSha -or
              $row.copied_fixture_sha256_after_probe -cne $pinnedSha -or
              $row.input_fixture_sha256_after_probe -cne $pinnedSha -or
              $row.termination -cne 'natural-close' -or $row.child_exit_code -ne 0 -or
              $row.child_trace_evidence.causal_integrity -cne 'pass' -or
              $row.child_trace_evidence.terminal_session -cne 'one-successful-root' -or
              $row.child_trace_evidence.dropped_records -ne 0 -or
              $row.child_trace_evidence.endpoints.'document.open'.status -cne 'success' -or
              $row.child_trace_evidence.endpoints.'document.open_to_editable'.status -cne 'success' -or
              $row.edit_dirty_ack_ms -ne $null -or $row.save_exact_ms -ne $null -or
              $row.configuration_ms -ne $null) {
            throw 'Natural-close source, provenance, trace, or no-mutation contract failed.'
          }
          Write-Host "Natural-close child open trace collected for $head; inspect draw status separately."
      - name: Upload Windows natural-close trace diagnostic
        if: always() && matrix.rid == 'win-x64'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-natural-close-win-x64
          path: |
            .cache/native-startup/ordinary-windows.jsonl
            .cache/native-startup/traces/**
            .cache/native-acceptance/corpus-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify OS-native offscreen text-canvas probe
        shell: pwsh
        timeout-minutes: 2
        run: |
          $rid = '${{ matrix.rid }}'
          $publish = "src/Mote.Native/bin/Release/net10.0/$rid/publish"
          $exe = if ($IsWindows) { Join-Path $publish 'mote.exe' } else { Join-Path $publish 'mote' }
          $flag = if ($IsWindows) { '--check-native-windows-canvas' } else { '--check-native-mac-canvas' }
          New-Item -ItemType Directory -Force -Path '.temp/ci-smoke' | Out-Null
          $start = @{
            FilePath = $exe
            ArgumentList = $flag
            PassThru = $true
            Wait = $true
            RedirectStandardOutput = '.temp/ci-smoke/canvas-stdout.txt'
            RedirectStandardError = '.temp/ci-smoke/canvas-stderr.txt'
          }
          if ($IsWindows) { $start.WindowStyle = 'Hidden' }
          $process = Start-Process @start
          $output = (Get-Content '.temp/ci-smoke/canvas-stdout.txt' -Raw).Trim()
          if ($process.ExitCode -ne 0) {
            throw "Native canvas probe exited $($process.ExitCode): $(Get-Content '.temp/ci-smoke/canvas-stderr.txt' -Raw)"
          }
          if ($IsWindows) {
            if ($output -cne 'mote-native-windows-canvas-ready cases=5 ascii=2 clusters=5') {
              throw "Unexpected Windows canvas marker: $output"
            }
          } elseif ($output -cmatch '^mote-native-mac-canvas-ready cases=4 painted=([0-9]+)$') {
            if ([long]$Matches[1] -le 0) { throw "Mac canvas painted no pixels: $output" }
          } else {
            throw "Unexpected macOS canvas marker: $output"
          }
          Write-Host "Native offscreen text-canvas probe passed: $output"
      - name: Smoke-test native executable without a display server
        shell: pwsh
        run: |
          $publish = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish"
          $executable = if ($IsWindows) { Join-Path $publish 'mote.exe' } else { Join-Path $publish 'mote' }
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw "Native executable missing: $executable" }
          New-Item -ItemType Directory -Force -Path '.temp/ci-smoke' | Out-Null
          $start = @{
            FilePath = $executable
            ArgumentList = '--check-runtime'
            PassThru = $true
            Wait = $true
            RedirectStandardOutput = '.temp/ci-smoke/runtime-stdout.txt'
            RedirectStandardError = '.temp/ci-smoke/runtime-stderr.txt'
          }
          if ($IsWindows) { $start.WindowStyle = 'Hidden' }
          $process = Start-Process @start
          $output = Get-Content '.temp/ci-smoke/runtime-stdout.txt' -Raw
          if ($process.ExitCode -ne 0) { throw "Native runtime check exited with code $($process.ExitCode): $(Get-Content '.temp/ci-smoke/runtime-stderr.txt' -Raw)" }
          if ($output.Trim() -ne 'mote-native-ready') { throw "Unexpected runtime-check output: $output" }
          Write-Host "Native runtime check passed: $executable"
      - name: Smoke-test native GUI startup
        shell: pwsh
        timeout-minutes: 2
        run: |
          $publish = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish"
          $executable = if ($IsWindows) { Join-Path $publish 'mote.exe' } else { Join-Path $publish 'mote' }
          $start = @{
            FilePath = $executable
            ArgumentList = '--smoke-gui'
            PassThru = $true
            Wait = $true
            RedirectStandardOutput = '.temp/ci-smoke/ui-stdout.txt'
            RedirectStandardError = '.temp/ci-smoke/ui-stderr.txt'
          }
          if ($IsWindows) { $start.WindowStyle = 'Hidden' }
          $process = Start-Process @start
          $output = Get-Content '.temp/ci-smoke/ui-stdout.txt' -Raw
          if ($process.ExitCode -ne 0) { throw "Native GUI smoke exited with code $($process.ExitCode): $(Get-Content '.temp/ci-smoke/ui-stderr.txt' -Raw)" }
          if ($output.Trim() -ne 'mote-native-gui-ready') { throw "Unexpected native GUI smoke output: $output" }
          Write-Host "Native GUI initialized and closed cleanly: $executable"
      # This opt-in read-only canvas is not the default editor. Gate only its
      # source-backed scroll/selection/contrast contract; retain PNGs on failure.
      - name: Verify read-only on-screen native canvas
        shell: pwsh
        timeout-minutes: 12
        run: |
          $rid = '${{ matrix.rid }}'
          $name = if ($IsWindows) { 'mote.exe' } else { 'mote' }
          & ./tests/NativeCanvasWindowWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/$name" `
            -RuntimeIdentifier $rid
      - name: Upload on-screen canvas diagnostic and PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-canvas-window-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/canvas-window.json
            .cache/canvas-window/${{ matrix.rid }}/**
          if-no-files-found: warn
          retention-days: 14
      - name: Verify real Win32 open-edit-save-reopen workflow
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        timeout-minutes: 3
        run: |
          $executable = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish/mote.exe"
          & ./tests/NativeWindowsWorkflow.ps1 -ExecutablePath $executable
      # Keep legacy-page compatibility strict; ordinary Continuous first earns
      # independent HWND/UIA/source-byte evidence without masking a failure.
      - name: Diagnose ordinary Windows Continuous open-edit-save-reopen (non-gating)
        if: always() && startsWith(matrix.rid, 'win-')
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeWindowsContinuousWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote.exe" `
            -ReportPath ".cache/ci-inventory/$rid/native-continuous-win.json"
      - name: Upload ordinary Windows Continuous diagnostic
        if: always() && startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v4
        with:
          name: native-continuous-win-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/native-continuous-win.json
            .temp/gui-continuous-workflow/**/*-stderr.txt
            .temp/gui-continuous-workflow/**/*-stdout.txt
            .temp/gui-continuous-workflow/**/stderr.txt
            .temp/gui-continuous-workflow/**/stdout.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # This 100 MiB ordinary product route uses a streaming byte oracle and
      # synthetic fixture cleanup; scrollbar movement is not a physical wheel.
      - name: Diagnose ordinary Windows Continuous 100 MiB source (non-gating)
        if: always() && startsWith(matrix.rid, 'win-')
        shell: pwsh
        timeout-minutes: 10
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeWindowsContinuousWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote.exe" `
            -ReportPath ".cache/ci-inventory/$rid/native-continuous-many100.json" `
            -ManyMiB 100
      - name: Upload ordinary Windows Continuous 100 MiB diagnostic
        if: always() && startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v4
        with:
          name: native-continuous-many100-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/native-continuous-many100.json
            .temp/gui-continuous-workflow/**/*-stderr.txt
            .temp/gui-continuous-workflow/**/*-stdout.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # Mutates only a GitHub-hosted runner's HKCU app preference inside one
      # try/finally, then restores the exact value kind/data or key absence.
      # Real HWND colors/selection are diagnostic until first hosted evidence.
      - name: Diagnose Windows live system-theme transition (non-gating)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          & ./tests/NativeThemeWorkflow-Windows.ps1 `
            -ExecutablePath 'src/Mote.Native/bin/Release/net10.0/win-x64/publish/mote.exe' `
            -RuntimeIdentifier win-x64
      - name: Upload Windows live-theme diagnostic
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: native-theme-win-x64
          path: |
            .cache/ci-inventory/win-x64/native-theme.json
            .cache/native-theme/win-x64/**/*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # The ordinary Continuous Canvas has a separate target-owned source and
      # palette contract. A killable GUI worker keeps HKCU restoration in the
      # independent owner even if UIA or PrintWindow stalls.
      - name: Diagnose ordinary Windows Canvas live theme (non-gating)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          $pins = @(
            @{ path = 'tests/NativeWindowsCanvasThemeWorkflow.ps1'; hashes = @('EF59B864E76869096FB5254AB0961911CEF2E22C57DEC4147A77A7F7C34F0291', '846534FD67513C5A3A3270AAFED749E03A458026C69FD8C55BA60A162EE3AE64') },
            @{ path = 'tests/NativeWindowsCanvasThemeWorker.ps1'; hashes = @('CE29B4A2985AEAC906DE05A7AD2A217C8F4F7D818A227A33477629C5B5702683', '54CF0E489DA42884A3AD17C2B8DA0B0D836F815233F7988F21F628AE7F77ED99') }
          )
          foreach ($pin in $pins) {
            $actual = (Get-FileHash -LiteralPath $pin.path -Algorithm SHA256).Hash
            if ($actual -cnotin $pin.hashes) { throw 'Canvas live-theme probe differs from reviewed bytes.' }
          }
          & pwsh -NoProfile -File ./tests/Test-NativeWindowsCanvasThemeContract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Canvas live-theme restoration contracts failed.' }
          & pwsh -NoProfile -File ./tests/NativeWindowsCanvasThemeWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote.exe" `
            -RuntimeIdentifier $rid
          if ($LASTEXITCODE -ne 0) { throw "Ordinary Canvas theme probe failed on $rid; inspect the retained report." }
      - name: Upload ordinary Windows Canvas live-theme diagnostic
        if: always() && startsWith(matrix.rid, 'win-')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-canvas-theme-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/native-canvas-theme.json
            .cache/native-canvas-theme/${{ matrix.rid }}/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # One-process-per-case screen observation after HKCU has been restored;
      # no p95 or physical-compositor latency claim from this first hosted pass.
      - name: Diagnose Windows external paint latency (non-gating)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 12
        continue-on-error: true
        run: |
          & ./benchmarks/NativePaintLatency/Measure-WindowsScreen.ps1 `
            -ExecutablePath 'src/Mote.Native/bin/Release/net10.0/win-x64/publish/mote.exe' `
            -Cases @('many-1','many-100') -Repetitions 1
      - name: Upload Windows external paint-latency observations
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: native-paint-latency-win-x64
          path: .cache/benchmarks/native-paint-latency/**/screen-observations.jsonl
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # The large opt-in canvas path is still diagnostic until hosted evidence
      # confirms both exact large-paste/Undo cases without a release claim.
      - name: Diagnose Windows canvas large Undo workflow (non-gating)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 15
        continue-on-error: true
        run: |
          $executable = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish/mote.exe"
          & ./tests/NativeWindowsCanvasLargeUndoWorkflow.ps1 -ExecutablePath $executable
      - name: Upload Windows canvas large Undo diagnostic
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: native-canvas-large-undo-win-x64
          path: .cache/canvas-large-undo/*.json
          if-no-files-found: warn
          retention-days: 14

# Build and test the complete single-file editor on both supported desktop platforms.
name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore mote.sln
      - name: Build complete solution, including desktop executable
        run: dotnet build mote.sln --configuration Release --no-restore
      - name: Test complete solution
        # The runner log already captures failures; avoid creating unuploaded
        # project-local TestResults outside the repository .cache/.temp roots.
        run: dotnet test mote.sln --configuration Release --no-build
      - name: Build non-gating benchmark harness
        run: dotnet build tests/Mote.Benchmarks/Mote.Benchmarks.csproj --configuration Release

  native-aot:
    name: Single-binary Native AOT / ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Native AOT requires a native linker/toolchain, hence the native-architecture matrix.
      - name: Publish native OS-shell executable
        run: dotnet publish src/Mote.Native/Mote.Native.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:ContinuousIntegrationBuild=true -p:DebugType=none -p:GenerateDocumentationFile=false -p:StripSymbols=false
      - name: Inventory Native AOT publish payload
        id: inventory
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $publish = "src/Mote.Native/bin/Release/net10.0/$rid/publish"
          $executableName = if ($IsWindows) { 'mote.exe' } else { 'mote' }
          $files = @(Get-ChildItem -LiteralPath $publish -File -Recurse | ForEach-Object {
            [pscustomobject]@{
              path = [IO.Path]::GetRelativePath((Resolve-Path $publish).Path, $_.FullName)
              bytes = $_.Length
            }
          })
          $other = @($files | Where-Object { $_.path -ne $executableName })
          $nativeLibraries = @($other | Where-Object { $_.path -match '\.(dll|dylib|so)$' })
          $inventory = [pscustomobject]@{
            rid = $rid
            executable = $executableName
            payload_files = $files
            non_executable_payload_count = $other.Count
            bundled_native_library_count = $nativeLibraries.Count
          }
          $directory = ".cache/ci-inventory/$rid"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $path = Join-Path $directory 'publish-inventory.json'
          $inventory | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $path -Encoding utf8
          Get-Content -LiteralPath $path
      - name: Verify macOS imports use system libraries
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        run: |
          $publish = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish"
          $imports = & otool -L (Join-Path $publish 'mote')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect native executable dependencies.' }
          $imports | ForEach-Object { Write-Host $_ }
          foreach ($line in $imports | Select-Object -Skip 1) {
            $dependency = ($line.Trim() -split '\s+')[0]
            if ($dependency -notmatch '^(/usr/lib/|/System/Library/)') {
              throw "Non-system Mach-O import violates the one-binary contract: $dependency"
            }
          }
      - name: Verify Windows imports use reviewed system DLLs
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          & .github/scripts/check-windows-imports.ps1 `
            -Executable "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote.exe" `
            -Report ".cache/ci-inventory/$rid/imports.json"
      - name: Upload native dependency inventory
        if: always() && steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-inventory-${{ matrix.rid }}
          path: .cache/ci-inventory/${{ matrix.rid }}/
          if-no-files-found: error
      - name: Assert strict single-binary delivery contract
        if: always() && steps.inventory.outcome == 'success'
        shell: pwsh
        run: |
          $inventory = Get-Content ".cache/ci-inventory/${{ matrix.rid }}/publish-inventory.json" -Raw | ConvertFrom-Json
          if ($inventory.non_executable_payload_count -ne 0) {
            throw "Native AOT publish is not one executable: $($inventory.non_executable_payload_count) additional payload files, including $($inventory.bundled_native_library_count) bundled native libraries. See uploaded inventory."
          }
      - name: Verify OS-native offscreen text-canvas probe
        shell: pwsh
        timeout-minutes: 2
        run: |
          $rid = '${{ matrix.rid }}'
          $publish = "src/Mote.Native/bin/Release/net10.0/$rid/publish"
          $exe = if ($IsWindows) { Join-Path $publish 'mote.exe' } else { Join-Path $publish 'mote' }
          $flag = if ($IsWindows) { '--check-native-windows-canvas' } else { '--check-native-mac-canvas' }
          New-Item -ItemType Directory -Force -Path '.temp/ci-smoke' | Out-Null
          $start = @{
            FilePath = $exe
            ArgumentList = $flag
            PassThru = $true
            Wait = $true
            RedirectStandardOutput = '.temp/ci-smoke/canvas-stdout.txt'
            RedirectStandardError = '.temp/ci-smoke/canvas-stderr.txt'
          }
          if ($IsWindows) { $start.WindowStyle = 'Hidden' }
          $process = Start-Process @start
          $output = (Get-Content '.temp/ci-smoke/canvas-stdout.txt' -Raw).Trim()
          if ($process.ExitCode -ne 0) {
            throw "Native canvas probe exited $($process.ExitCode): $(Get-Content '.temp/ci-smoke/canvas-stderr.txt' -Raw)"
          }
          if ($IsWindows) {
            if ($output -cne 'mote-native-windows-canvas-ready cases=5 ascii=2 clusters=5') {
              throw "Unexpected Windows canvas marker: $output"
            }
          } elseif ($output -cmatch '^mote-native-mac-canvas-ready cases=4 painted=([0-9]+)$') {
            if ([long]$Matches[1] -le 0) { throw "Mac canvas painted no pixels: $output" }
          } else {
            throw "Unexpected macOS canvas marker: $output"
          }
          Write-Host "Native offscreen text-canvas probe passed: $output"
      - name: Smoke-test native executable without a display server
        shell: pwsh
        run: |
          $publish = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish"
          $executable = if ($IsWindows) { Join-Path $publish 'mote.exe' } else { Join-Path $publish 'mote' }
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw "Native executable missing: $executable" }
          New-Item -ItemType Directory -Force -Path '.temp/ci-smoke' | Out-Null
          $start = @{
            FilePath = $executable
            ArgumentList = '--check-runtime'
            PassThru = $true
            Wait = $true
            RedirectStandardOutput = '.temp/ci-smoke/runtime-stdout.txt'
            RedirectStandardError = '.temp/ci-smoke/runtime-stderr.txt'
          }
          if ($IsWindows) { $start.WindowStyle = 'Hidden' }
          $process = Start-Process @start
          $output = Get-Content '.temp/ci-smoke/runtime-stdout.txt' -Raw
          if ($process.ExitCode -ne 0) { throw "Native runtime check exited with code $($process.ExitCode): $(Get-Content '.temp/ci-smoke/runtime-stderr.txt' -Raw)" }
          if ($output.Trim() -ne 'mote-native-ready') { throw "Unexpected runtime-check output: $output" }
          Write-Host "Native runtime check passed: $executable"
      - name: Smoke-test native GUI startup
        shell: pwsh
        timeout-minutes: 2
        run: |
          $publish = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish"
          $executable = if ($IsWindows) { Join-Path $publish 'mote.exe' } else { Join-Path $publish 'mote' }
          $start = @{
            FilePath = $executable
            ArgumentList = '--smoke-gui'
            PassThru = $true
            Wait = $true
            RedirectStandardOutput = '.temp/ci-smoke/ui-stdout.txt'
            RedirectStandardError = '.temp/ci-smoke/ui-stderr.txt'
          }
          if ($IsWindows) { $start.WindowStyle = 'Hidden' }
          $process = Start-Process @start
          $output = Get-Content '.temp/ci-smoke/ui-stdout.txt' -Raw
          if ($process.ExitCode -ne 0) { throw "Native GUI smoke exited with code $($process.ExitCode): $(Get-Content '.temp/ci-smoke/ui-stderr.txt' -Raw)" }
          if ($output.Trim() -ne 'mote-native-gui-ready') { throw "Unexpected native GUI smoke output: $output" }
          Write-Host "Native GUI initialized and closed cleanly: $executable"
      # This opt-in read-only canvas is not the default editor. Gate only its
      # source-backed scroll/selection/contrast contract; retain PNGs on failure.
      - name: Verify read-only on-screen native canvas
        shell: pwsh
        timeout-minutes: 12
        run: |
          $rid = '${{ matrix.rid }}'
          $name = if ($IsWindows) { 'mote.exe' } else { 'mote' }
          & ./tests/NativeCanvasWindowWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/$name" `
            -RuntimeIdentifier $rid
      - name: Upload on-screen canvas diagnostic and PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-canvas-window-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/canvas-window.json
            .cache/canvas-window/${{ matrix.rid }}/**
          if-no-files-found: warn
          retention-days: 14
      - name: Verify real Win32 open-edit-save-reopen workflow
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        timeout-minutes: 3
        run: |
          $executable = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish/mote.exe"
          & ./tests/NativeWindowsWorkflow.ps1 -ExecutablePath $executable
      # Mutates only a GitHub-hosted runner's HKCU app preference inside one
      # try/finally, then restores the exact value kind/data or key absence.
      # Real HWND colors/selection are diagnostic until first hosted evidence.
      - name: Diagnose Windows live system-theme transition (non-gating)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          & ./tests/NativeThemeWorkflow-Windows.ps1 `
            -ExecutablePath 'src/Mote.Native/bin/Release/net10.0/win-x64/publish/mote.exe' `
            -RuntimeIdentifier win-x64
      - name: Upload Windows live-theme diagnostic
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: native-theme-win-x64
          path: |
            .cache/ci-inventory/win-x64/native-theme.json
            .cache/native-theme/win-x64/**/*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # One-process-per-case screen observation after HKCU has been restored;
      # no p95 or physical-compositor latency claim from this first hosted pass.
      - name: Diagnose Windows external paint latency (non-gating)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 12
        continue-on-error: true
        run: |
          & ./benchmarks/NativePaintLatency/Measure-WindowsScreen.ps1 `
            -ExecutablePath 'src/Mote.Native/bin/Release/net10.0/win-x64/publish/mote.exe' `
            -Cases @('many-1','many-100') -Repetitions 1
      - name: Upload Windows external paint-latency observations
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: native-paint-latency-win-x64
          path: .cache/benchmarks/native-paint-latency/**/screen-observations.jsonl
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # The large opt-in canvas path is still diagnostic until hosted evidence
      # confirms both exact large-paste/Undo cases without a release claim.
      - name: Diagnose Windows canvas large Undo workflow (non-gating)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 15
        continue-on-error: true
        run: |
          $executable = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish/mote.exe"
          & ./tests/NativeWindowsCanvasLargeUndoWorkflow.ps1 -ExecutablePath $executable
      - name: Upload Windows canvas large Undo diagnostic
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: native-canvas-large-undo-win-x64
          path: .cache/canvas-large-undo/*.json
          if-no-files-found: warn
          retention-days: 14
      # Real HWND horizontal navigation/selection on a 50 MiB unique-marker
      # line; still diagnostic until hosted GUI and additional RID evidence.
      - name: Diagnose Windows horizontal canvas workflow (non-gating)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 10
        continue-on-error: true
        run: |
          & ./tests/NativeWindowsHorizontalWorkflow.ps1 `
            -ExecutablePath 'src/Mote.Native/bin/Release/net10.0/win-x64/publish/mote.exe'
      - name: Upload Windows horizontal canvas diagnostic
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-horizontal-win-x64
          path: |
            .cache/windows-horizontal/latest.json
            .temp/windows-horizontal/**/result.json
            .temp/windows-horizontal/**/*.png
            .temp/windows-horizontal/**/*-stdout.txt
            .temp/windows-horizontal/**/*-stderr.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Diagnose Windows native config and trace placement (non-gating)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 6
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeWindowsConfigWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote.exe" `
            -RuntimeIdentifier $rid
      - name: Upload Windows native config diagnostic
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: native-config-win-x64
          path: .cache/ci-inventory/win-x64/windows-config-runtime.json
          if-no-files-found: warn
          retention-days: 14
      # A separate WPF client exercises the real published UIA provider. Known
      # duplicate Document nodes remain a release blocker, not a skipped check.
      - name: Diagnose external Windows UIA canvas provider (non-gating)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/WindowsAxExternalProbe/Run.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote.exe" `
            -Rid $rid `
            -ReportPath ".cache/windows-ax-external/$rid/report.json"
          if ($LASTEXITCODE -ne 0) {
            throw "External UIA client found a behavioral failure or release blocker; inspect the uploaded $rid report."
          }
      - name: Upload external Windows UIA diagnostic
        if: always() && startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v4
        with:
          name: windows-ax-external-${{ matrix.rid }}
          path: .cache/windows-ax-external/${{ matrix.rid }}/report.json
          if-no-files-found: warn
          retention-days: 14
      # Paired opt-in fragment tree on the same published EXE; ARM64 and real
      # screen-reader behavior remain unknown, so this is not a release gate.
      - name: Diagnose Windows UIA fragment experiment (non-gating)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/WindowsAxExternalProbe/Run.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote.exe" `
            -Rid $rid `
            -FragmentExperiment `
            -ReportPath ".cache/windows-ax-external/$rid/fragment-report.json"
          if ($LASTEXITCODE -ne 0) {
            throw "UIA fragment experiment failed; inspect the uploaded $rid report."
          }
      - name: Upload Windows UIA fragment diagnostic
        if: always() && startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v4
        with:
          name: windows-ax-fragment-${{ matrix.rid }}
          path: .cache/windows-ax-external/${{ matrix.rid }}/fragment-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify macOS Launch Services can open the standalone executable
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 2
        run: |
          $executable = (Resolve-Path "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish/mote").Path
          & open -W -a $executable --args --smoke-gui
          if ($LASTEXITCODE -ne 0) { throw "Launch Services rejected standalone mote (exit $LASTEXITCODE)." }
      - name: Verify in-process AppKit open-edit-save-new-reopen workflow
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 2
        run: |
          $executable = "src/Mote.Native/bin/Release/net10.0/${{ matrix.rid }}/publish/mote"
          & ./tests/NativeMacWorkflow.ps1 -ExecutablePath $executable
      # These opt-in AppKit input-island checks are required on both Mac RIDs;
      # they do not claim external keyboard, CJK IME, or VoiceOver coverage.
      - name: Verify macOS canvas mixed-clipboard workflow
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 8
        env:
          MOTE_NATIVE_MAC_STAGE_TRACE: ${{ matrix.rid == 'osx-arm64' && '1' || '0' }}
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeMacCanvasClipboardWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote" `
            -RuntimeIdentifier $rid
      - name: Upload macOS canvas clipboard diagnostic
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-canvas-clipboard-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/canvas-clipboard*.txt
            .cache/ci-inventory/${{ matrix.rid }}/mac-canvas-clipboard-metrics.txt
            .cache/ci-inventory/${{ matrix.rid }}/canvas-clipboard.json
            .temp/canvas-clipboard-*.txt
          if-no-files-found: warn
          retention-days: 14
      # Run the smallest real opt-in canvas under LLDB only on ARM64; stage
      # codes and bounded backtrace are diagnostic, never a substitute for the
      # blocking clipboard/selection workflow above.
      - name: Diagnose macOS ARM canvas startup crash (non-gating)
        if: always() && matrix.rid == 'osx-arm64'
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          & ./tests/NativeMacCanvasCrashProbe.ps1 `
            -ExecutablePath 'src/Mote.Native/bin/Release/net10.0/osx-arm64/publish/mote' `
            -RuntimeIdentifier osx-arm64
      - name: Upload macOS ARM canvas startup crash diagnostic
        if: always() && matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: mac-canvas-crash-osx-arm64
          path: |
            .cache/ci-inventory/osx-arm64/mac-canvas-crash.json
            .cache/ci-inventory/osx-arm64/mac-canvas-crash-*-stdout.txt
            .cache/ci-inventory/osx-arm64/mac-canvas-crash-*-stderr.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Verify macOS canvas empty-host delete
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 5
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeMacCanvasDeleteWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote" `
            -RuntimeIdentifier $rid
      - name: Upload macOS canvas delete diagnostic
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-canvas-delete-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/mac-canvas-delete*.txt
            .cache/ci-inventory/${{ matrix.rid }}/mac-canvas-delete.json
            .temp/canvas-delete-*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnose in-process macOS canvas AX selector (non-gating)
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeMacCanvasAxWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote" `
            -RuntimeIdentifier $rid
      - name: Upload in-process macOS canvas AX diagnostic
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-canvas-ax-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/mac-canvas-ax.json
            .cache/ci-inventory/${{ matrix.rid }}/mac-canvas-ax*.txt
            .temp/canvas-ax-in-*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnose macOS native config and trace placement (non-gating)
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeMacConfigWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote" `
            -RuntimeIdentifier $rid
      - name: Upload macOS config and trace diagnostic
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-config-runtime-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/mac-config-runtime.json
            .temp/mac-config-runtime/**
          if-no-files-found: warn
          retention-days: 14
      - name: Probe hosted macOS external Accessibility automation
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 2
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeMacAccessibilityProbe.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote" `
            -ReportPath ".cache/ci-inventory/$rid/mac-accessibility.json"
      - name: Upload macOS Accessibility environment report
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-accessibility-${{ matrix.rid }}
          path: .cache/ci-inventory/${{ matrix.rid }}/mac-accessibility.json
          if-no-files-found: error
      # A separately compiled Swift process traverses the published canvas AX
      # tree. The first host run is diagnostic; TCC denials have their own JSON.
      - name: Diagnose external macOS canvas AX provider (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 6
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/MacAxExternalProbe/Run.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote" `
            -ReportPath ".cache/ci-inventory/$rid/mac-ax-external.json"
      - name: Upload external macOS canvas AX diagnostic
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-ax-external-${{ matrix.rid }}
          path: .cache/ci-inventory/${{ matrix.rid }}/mac-ax-external.json
          if-no-files-found: warn
          retention-days: 14
      # The opt-in AppKit canvas owns source-row paint; a focused native text
      # input lives only in its reserved bottom ribbon. This first probe is
      # synthetic in-process pan/copy, not external trackpad or CJK IME proof.
      - name: Diagnose macOS horizontal canvas ribbon (non-gating)
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        env:
          MOTE_NATIVE_MAC_STAGE_TRACE: ${{ matrix.rid == 'osx-arm64' && '1' || '0' }}
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeMacHorizontalWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote" `
            -RuntimeIdentifier $rid
      - name: Upload macOS horizontal canvas ribbon diagnostic
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-horizontal-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/horizontal.json
            .cache/ci-inventory/${{ matrix.rid }}/horizontal-stdout.txt
            .cache/ci-inventory/${{ matrix.rid }}/horizontal-stderr.txt
            .cache/horizontal-*/*.png
            .cache/horizontal-*/metrics.txt
            .cache/horizontal-*/last-stage.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # Process-local DarkAqua/Aqua/DarkAqua callback and attributed-color
      # probe in two separate published-Mach-O processes; not global OS theme.
      - name: Diagnose macOS window-local live theme (non-gating)
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeThemeWorkflow-Mac.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote" `
            -RuntimeIdentifier $rid
      - name: Upload macOS window-local live-theme diagnostic
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: native-theme-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/native-theme-mac.json
            .cache/ci-inventory/${{ matrix.rid }}/native-theme-*-stdout.txt
            .cache/ci-inventory/${{ matrix.rid }}/native-theme-*-stderr.txt
            .cache/native-theme-${{ matrix.rid }}-*/*.json
            .cache/native-theme-${{ matrix.rid }}-*/*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      # Initial external keyboard/edit/save capability probe for the opt-in
      # canvas. AX range movement is not a physical-paint or host-size oracle.
      - name: Diagnose external macOS ARM canvas GUI workflow (non-gating)
        if: always() && matrix.rid == 'osx-arm64'
        shell: pwsh
        timeout-minutes: 10
        continue-on-error: true
        run: |
          & ./benchmarks/NativeCanvasGui/Measure-MacCanvasGui.ps1 `
            -ExecutablePath 'src/Mote.Native/bin/Release/net10.0/osx-arm64/publish/mote'
      - name: Upload external macOS ARM canvas GUI diagnostic
        if: always() && matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: native-canvas-gui-osx-arm64
          path: |
            .cache/benchmarks/native-canvas-gui-osx-arm64.jsonl
            .temp/benchmarks/native-canvas-gui/**/*.applescript
            .temp/benchmarks/native-canvas-gui/**/*.stdout.txt
            .temp/benchmarks/native-canvas-gui/**/*.stderr.txt
            .temp/benchmarks/native-canvas-gui/**/*-stdout.txt
            .temp/benchmarks/native-canvas-gui/**/*-stderr.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Verify external macOS keyboard edit-save-reopen workflow
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: pwsh
        timeout-minutes: 3
        run: |
          $rid = '${{ matrix.rid }}'
          & ./tests/NativeMacExternalWorkflow.ps1 `
            -ExecutablePath "src/Mote.Native/bin/Release/net10.0/$rid/publish/mote" `
            -ReportPath ".cache/ci-inventory/$rid/mac-external-workflow.json"
      - name: Upload external macOS workflow report
        if: always() && startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-external-workflow-${{ matrix.rid }}
          path: |
            .cache/ci-inventory/${{ matrix.rid }}/mac-external-workflow.json
            .temp/mac-external-workflow/**
          if-no-files-found: warn
      - name: Upload failed GUI workflow fixtures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-gui-workflow-${{ matrix.rid }}
          path: |
            .temp/mac-native-*.txt
            .temp/ci-smoke/canvas-*.txt
            .temp/gui-workflow/**
          if-no-files-found: ignore
